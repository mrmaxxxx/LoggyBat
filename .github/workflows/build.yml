name: Build LoggyBat

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Check G HUB parsing
        shell: pwsh
        run: dotnet run --project tests/GHubProtocolCheck -c Release

      # Version = 1.1.<run number>.0. The run number grows by one with every run
      # of this workflow, so each build installs as an update over the previous one.
      - name: Set version
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}.0"
          $manifest = Resolve-Path 'src\LoggyBat.Package\Package.appxmanifest'
          $xml = [xml](Get-Content $manifest -Raw)
          $xml.Package.Identity.Version = $version
          $xml.Save($manifest)
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Package version: $version"

      # Restore first, so the license/notice files of the exact resolved package versions can be
      # copied into the package before it is built (they must travel inside the MSIX too).
      - name: Restore packages
        shell: pwsh
        run: |
          msbuild (Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat.Package\LoggyBat.Package.wapproj') /t:Restore `
            /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { throw "Restore failed." }

      - name: Collect license notices
        shell: pwsh
        run: |
          ./scripts/Collect-Notices.ps1 `
            -Assets (Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat\obj\project.assets.json') `
            -OutApp (Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat.Package\Notices') `
            -OutKit (Join-Path $env:RUNNER_TEMP 'kit-notices')

      - name: Build package
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat.Package\LoggyBat.Package.wapproj'
          $output = Join-Path $env:GITHUB_WORKSPACE 'AppPackages'
          $pluginVersion = $env:VERSION -replace '\.0$', ''

          msbuild $project /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            "/p:WidBarPluginVersion=$pluginVersion" `
            "/p:AppxPackageDir=$output\"

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed. See MSBuild output above."
          }

      # Windows App SDK 2.3.1 resolved WinUI 2.3.0, whose license forbids redistribution
      # (https://github.com/microsoft/WindowsAppSDK/issues/6654). Expect 2.3.6 from SDK 2.4.0.
      - name: Check WinUI version
        shell: pwsh
        run: |
          $msix = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Recurse -File -Filter *.msix |
            Where-Object FullName -notmatch '[\\/]Dependencies[\\/]')
          if ($msix.Count -ne 1) { throw "Expected one app MSIX, found $($msix.Count)." }
          ./scripts/Test-WinUIVersion.ps1 -Msix $msix[0].FullName `
            -Project (Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat\LoggyBat.csproj')

      # The texts themselves must be inside the MSIX, not just listed (see the script).
      - name: Check license notices
        shell: pwsh
        run: |
          $msix = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') -Recurse -File -Filter *.msix |
            Where-Object FullName -notmatch '[\\/]Dependencies[\\/]')
          if ($msix.Count -ne 1) { throw "Expected one app MSIX, found $($msix.Count)." }
          ./scripts/Test-Notices.ps1 -Msix $msix[0].FullName `
            -Assets (Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat\obj\project.assets.json')

      # The same CN=Max certificate every time, from repository secrets
      # (see docs/HANDOFF.md). The private key lives only in RUNNER_TEMP
      # during this step; only the public .cer goes into the artifact.
      - name: Sign package
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw "Signing secrets SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD are not set. See docs/HANDOFF.md."
          }

          $output = Join-Path $env:GITHUB_WORKSPACE 'AppPackages'
          $packages = @(Get-ChildItem $output -Recurse -File |
            Where-Object {
              $_.Extension -in '.msix', '.appx' -and
              $_.FullName -notmatch '[\\/]Dependencies[\\/]'
            })

          if ($packages.Count -eq 0) {
            throw "No application package was generated."
          }

          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = Get-ChildItem "$sdkBin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signTool) {
            throw "SignTool not found."
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'loggybat-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD)

            if ($cert.Subject -ne 'CN=Max') {
              throw "Signing certificate subject is '$($cert.Subject)', expected 'CN=Max' (must match Publisher in Package.appxmanifest)."
            }
            Write-Host "Signing with CN=Max, thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter)"

            $cer = Join-Path $output 'LoggyBat.cer'
            [IO.File]::WriteAllBytes($cer, $cert.Export('Cert'))

            # The runner must trust the certificate for 'signtool verify' to pass.
            Import-Certificate -FilePath $cer `
              -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

            foreach ($package in $packages) {
              & $signTool.FullName sign /fd SHA256 `
                /f $pfx /p $env:PFX_PASSWORD $package.FullName

              if ($LASTEXITCODE -ne 0) {
                throw "Package signing failed."
              }

              & $signTool.FullName verify /pa $package.FullName

              if ($LASTEXITCODE -ne 0) {
                throw "Package signature verification failed."
              }
            }
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # Two download kits instead of the whole AppPackages folder (see the script for what is left out).
      - name: Assemble download kits
        shell: pwsh
        run: |
          ./scripts/New-DownloadKits.ps1 `
            -AppPackages (Join-Path $env:GITHUB_WORKSPACE 'AppPackages') `
            -Out (Join-Path $env:GITHUB_WORKSPACE 'kits') `
            -AppNotices (Join-Path $env:GITHUB_WORKSPACE 'src\LoggyBat.Package\Notices') `
            -KitNotices (Join-Path $env:RUNNER_TEMP 'kit-notices')

      - name: Upload update kit
        uses: actions/upload-artifact@v4
        with:
          name: LoggyBat-update-x64-${{ env.VERSION }}
          path: kits/update/
          if-no-files-found: error
          retention-days: 7

      - name: Upload first-install kit
        uses: actions/upload-artifact@v4
        with:
          name: LoggyBat-first-install-x64-${{ env.VERSION }}
          path: kits/first-install/
          if-no-files-found: error
          retention-days: 7
